# Release: goreleaser ships cmd/shortfall binaries, triggered by the WAVE-3
# tag (`cmd/shortfall/v*`), not the root `v*` tag.
#
# The trigger is the wave-3 tag because cmd/shortfall carries no `replace`
# directives — that is what makes `go install .../cmd/shortfall@version`
# work (workspace-47f) — so its build resolves the core and the two query
# adapters from published tags, exactly as an adopter does. Firing on the
# root `v*` tag would build the CLI before waves 2 and 3 exist, against the
# PREVIOUS release's library, and ship it under the new version's name.
#
# The earlier waves are tagged on an EARLIER commit, not this one: with no
# replaces, cmd/shortfall/go.sum can only gain a version's hashes once that
# version is fetchable, so the tidied go.sum is committed after waves 1-2 and
# the wave-3 tag lands on that commit. The guard below therefore asks for
# reachability, not equality. Waves are documented in CONTRIBUTING, "Releases".
#
# goreleaser cannot read a slash-prefixed tag as semver, and `monorepo:
# tag_prefix` is a Pro-only field the pinned OSS build rejects, so the
# version is handed over explicitly as GORELEASER_CURRENT_TAG — the root
# tag, which is also where the GitHub release and its assets land.
#
# Dry-run: workflow_dispatch runs a snapshot build (no tag, no publish) —
# the release-tooling acceptance evidence and a rehearsal before any tag.
# Library consumers are unaffected: modules are consumed by git tag via
# `go get`; this workflow only adds CLI binaries + checksums to the release.
#
# Two jobs so the snapshot path stays least-privilege: only the tag path
# holds contents:write.
name: release

on:
  push:
    tags: ["cmd/shortfall/v*"]
  workflow_dispatch: {}   # snapshot dry-run

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release + upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # goreleaser reads full history for the changelog
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: stable
          cache: true
      # Fail here, with a sentence, rather than shipping a wrong binary or
      # letting goreleaser fail three steps later on a tag it cannot explain.
      # The requires are read with `go mod edit -json`, not grepped: quoted
      # module paths are legal go.mod grammar, and a pattern that silently
      # matches none of them would report green over exactly the release this
      # step exists to stop. A missing or unreadable go.mod is fatal for the
      # same reason, and so is finding no first-party require at all.
      - name: the release names one version, and every wave it needs is tagged
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#cmd/shortfall/}"
          if [ "$version" = "$TAG" ]; then
            echo "::error::tag $TAG does not carry the cmd/shortfall/ prefix this job triggers on."
            exit 1
          fi
          echo "wave-3 tag $TAG -> version $version"

          mod=cmd/shortfall/go.mod
          test -f "$mod" || { echo "::error::$mod is missing — this guard would verify nothing."; exit 1; }

          # Parse once, and fail on a parse error as a parse error: `go mod
          # edit -json` writes its diagnosis to stderr and nothing to stdout,
          # so reading its output inside a later test would report a malformed
          # go.mod as whatever that test is about.
          if ! parsed=$(go mod edit -json "$mod"); then
            echo "::error::$mod could not be parsed by \`go mod edit -json\` (output above)."
            exit 1
          fi
          if [ -z "$parsed" ]; then
            echo "::error::\`go mod edit -json $mod\` produced no output, so nothing below would be checked."
            exit 1
          fi

          # `go install pkg@version` refuses a module carrying ANY replace, so
          # the release must never publish one. test/modgraph holds the same
          # line on every commit; this is the last gate before it ships.
          if [ "$(printf '%s' "$parsed" | jq '.Replace | length')" != "0" ]; then
            echo "::error::$mod carries replace directives, which break go install for every adopter:"
            printf '%s' "$parsed" | jq -r '.Replace[] | "  \(.Old.Path) => \(.New.Path)"'
            exit 1
          fi

          requires=$(printf '%s' "$parsed" \
            | jq -r '.Require[]? | select(.Path == "github.com/NightWatchEng/shortfall" or (.Path | startswith("github.com/NightWatchEng/shortfall/"))) | "\(.Path) \(.Version)"')
          if [ -z "$requires" ]; then
            echo "::error::no first-party requires found in $mod. The CLI depends on the core and two query adapters, so zero means this guard read the wrong thing."
            exit 1
          fi
          echo "checking $(printf '%s\n' "$requires" | grep -c .) first-party require(s)"

          # Each require must name THIS release, and the tag that publishes it
          # must already exist and be reachable from here — wave 1 for the
          # core, wave 2 for each adapter. Checking only the root tag would
          # let a skipped wave 2 through to an opaque goreleaser failure.
          # A herestring, not a pipe: `exit 1` inside a piped `while read`
          # ends only the subshell. `set -e` would still fail the step here,
          # but on the pipeline's status rather than at the line that decided,
          # and the loop's later iterations would run first.
          while IFS=' ' read -r path got; do
            if [ "$got" != "$version" ]; then
              echo "::error::$mod requires $path at $got, not $version — the CLI would ship under $version built against $got."
              exit 1
            fi

            sub="${path#github.com/NightWatchEng/shortfall}"
            sub="${sub#/}"
            tag="${sub:+$sub/}$version"
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::tag $tag does not exist. Push the earlier tag waves before $TAG (CONTRIBUTING, Releases)."
              exit 1
            fi
            if ! git merge-base --is-ancestor "refs/tags/$tag^{commit}" HEAD; then
              echo "::error::tag $tag is not reachable from this commit, so it does not publish the tree being built."
              exit 1
            fi
            echo "  ok $path $version (tag $tag)"
          done <<< "$requires"

          echo "GORELEASER_CURRENT_TAG=$version" >> "$GITHUB_ENV"
      # `--skip=validate` drops two goreleaser checks, and both are replaced
      # rather than dropped. It requires GORELEASER_CURRENT_TAG to name a tag
      # at HEAD (`git describe --exact-match`), which this release shape makes
      # impossible: the root tag is on the earlier commit by construction, so
      # that check cannot pass on a correct release. It also refuses a dirty
      # tree — asserted below instead, since a fresh checkout is the only way
      # this job runs. Everything else the step above checks (no replaces,
      # every first-party require naming this version, every wave's tag
      # present and reachable) is strictly more than goreleaser validates.
      - name: the checkout is clean
        run: git diff --quiet && git diff --cached --quiet
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          version: v2.18.0
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # builds and uploads an artifact; publishes nothing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: stable
          cache: true
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a  # v6
        with:
          version: v2.18.0
          args: release --snapshot --clean
      - name: upload snapshot artifacts (dry-run evidence)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: snapshot-dist
          path: dist/
