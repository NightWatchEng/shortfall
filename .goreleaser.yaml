# goreleaser config for the shortfall CLI. Library consumers use go get +
# module tags; this ships cmd/shortfall binaries, triggered by the wave-3
# `cmd/shortfall/v*` tag and published onto the root tag's release (the
# workflow passes that version as GORELEASER_CURRENT_TAG, since a
# slash-prefixed tag is not semver and `monorepo: tag_prefix` is Pro-only).
# Validate: goreleaser check · local dry-run: goreleaser release --snapshot --clean
version: 2

project_name: shortfall

builds:
  - id: shortfall
    # cmd/shortfall is its OWN module (M6.7.7) so the CLI's promql/sql adapter
    # deps stay out of the core library. Build it as a nested module: `dir`
    # cd's into it and `main: .` builds from its own go.mod — independent of
    # the root go.work (a release checkout must not depend on workspace mode).
    # That module carries no `replace` directives (workspace-47f), so this
    # build resolves the core and the two query adapters from published tags,
    # exactly as `go install` does for an adopter. It fails loudly if a wave
    # was skipped, which is why the trigger is the wave-3 tag.
    dir: ./cmd/shortfall
    main: .
    binary: shortfall
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^chore:", "^docs:"]

release:
  draft: false
  # `auto` marks a release pre-release ONLY when the tag carries a semver
  # pre-release suffix (v0.3.0-rc1); a plain v0.2.0 publishes as a full
  # release. Instability of v0.x is a semver-policy statement (README),
  # not something this flag provides.
  prerelease: auto
